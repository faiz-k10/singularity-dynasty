name: Weekly run

# The site's weekly publishing, on GitHub's computers (no Mac, no Claude needed). Each run calls web/scripts/weekly-run.mjs, which runs the R
# model, publishes to Supabase, checks the result and records it for /admin (Storage bucket "ops"). A failed run makes GitHub email you.
#
#   Tuesday   1:30 PM ET   tuesday       finished week's game data, then next week's projections + sims (only if the week is complete), email, backup
#   Wednesday 9 AM ET      game-data     late stat corrections and expected points
#   Thursday  5 PM ET      projections   injury news before Thursday night
#   Sunday    11 AM ET     projections   last injury news before the 1 PM games
#
# Times are UTC and fixed, so the Eastern times above are winter ones; in summer each runs an hour later. While the older Claude-run tasks
# on the Mac are still on, they and these runs cover for each other: whichever runs second skips itself if the job already passed
# (both record the result in the same place). To run one now: Actions tab -> Weekly run -> Run workflow -> pick the job.
# Needs repository secrets NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY (the email ones are optional until Resend is set up).

on:
  # Each job has two or three triggers: GitHub delays or drops scheduled runs when it is busy (the hourly uptime check has fired only every
  # 4-6 hours at times), and a later trigger skips itself when that day's job already passed (SKIP_IF_DONE_HOURS) but retries a failed one.
  schedule:
    - cron: "30 18 * * 2" # Tuesday
    - cron: "0 20 * * 2"
    - cron: "30 21 * * 2"
    - cron: "0 14 * * 3" # Wednesday
    - cron: "30 15 * * 3"
    - cron: "0 22 * * 4" # Thursday
    - cron: "0 23 * * 4"
    - cron: "0 16 * * 0" # Sunday
    - cron: "45 16 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: Which job to run
        type: choice
        options: [tuesday, game-data, projections, backup]
        default: projections

concurrency:
  group: weekly-run # never two publishes at once; a second one waits
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Pick the job
        id: mode
        run: |
          sched="${{ github.event.schedule }}"
          if [ -n "$sched" ]; then
            case "$(echo "$sched" | awk '{print $5}')" in  # the day of the week
              2) m=tuesday ;;
              3) m=game-data ;;
              4|0) m=projections ;;
            esac
            echo "skip=8" >> "$GITHUB_OUTPUT"  # a scheduled re-trigger skips a job that passed in the last 8 hours
          else
            m="${{ inputs.mode }}"
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "Job: $m"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the site's packages
        working-directory: web
        run: npm ci

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # prebuilt Linux packages: installs take seconds, not minutes

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-nflreadr-jsonlite-v1

      - name: Install R packages
        run: Rscript -e 'for (p in c("nflreadr", "jsonlite")) if (!requireNamespace(p, quietly = TRUE)) install.packages(p)'

      - name: Write the environment file
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          EMAIL_FOOTER_ADDRESS: ${{ secrets.EMAIL_FOOTER_ADDRESS }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Add the NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets first"; exit 1
          fi
          : > .env.local
          for k in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY RESEND_API_KEY EMAIL_FROM NEXT_PUBLIC_SITE_URL EMAIL_FOOTER_ADDRESS; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s=%s\n' "$k" "$v" >> .env.local; fi  # (an "a && b" here would fail the step when the last one is empty)
          done

      - name: Run ${{ steps.mode.outputs.mode }}
        working-directory: web
        env:
          BACKUP_DIR: ${{ github.workspace }}/backups
          SKIP_IF_DONE_HOURS: ${{ steps.mode.outputs.skip }}
        run: node --env-file=.env.local scripts/weekly-run.mjs "${{ steps.mode.outputs.mode }}"

      - name: Keep the backup
        if: always() && hashFiles('backups/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backups/
          retention-days: 60
