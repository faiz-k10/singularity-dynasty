name: CI

# MINUTES BUDGET (Nov 19 2026): this workflow ran on EVERY push and used ~2,500 of the free plan's 2,000 minutes a month (560 pushes x
# ~5 minutes, two jobs each), which starved the weekly data runs. It now runs:
#   - once a night, and only if the site's code changed in the last day (a quick git check first; ~0 minutes on quiet days)
#   - on pull requests and by hand (Actions tab -> CI -> Run workflow)
# Vercel still builds every push before it goes live (a broken build never deploys), and the tests run locally before each commit.
# Worst case ~30 runs x ~4 minutes = ~120 minutes a month. Every job has a timeout, so nothing can hang for hours.
# The route smoke test was removed from CI: the tool pages now read with the database's service-role key, and that key does not belong
# in a job that runs on every change. Run it locally instead (npm run build && npm start, then npm run smoke).
on:
  schedule:
    - cron: "23 7 * * *" # nightly; Mondays also catch new security advisories even in a quiet week
  pull_request:
    paths: ["web/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

# a newer run replaces one still going for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `next build` imports the Stripe API route modules, which construct a Stripe client from this at module load (no network call). The real
# key lives in Vercel; this placeholder just has to be a non-empty string.
env:
  STRIPE_SECRET_KEY: sk_test_ci_build_placeholder

defaults:
  run:
    working-directory: web

# Least privilege: the built-in GitHub token can only read this repository (it never needs to push).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      # Nightly: skip everything (in seconds) unless web/ changed in the last 25 hours -- except Mondays, for the advisory check.
      - name: Anything to check?
        id: changed
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%u)" = "1" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -n "$(git log --since='25 hours ago' --format=%H -- web .github/workflows/ci.yml)" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "No code changes since yesterday: nothing to check."; fi
      - if: steps.changed.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.changed.outputs.go == 'true'
        run: npm ci
      # The packages the site actually runs (not dev tooling) must have no high or critical advisory.
      - if: steps.changed.outputs.go == 'true'
        run: npm audit --omit=dev --audit-level=high
      - if: steps.changed.outputs.go == 'true'
        run: npm run lint
      - if: steps.changed.outputs.go == 'true'
        run: npm test
      - if: steps.changed.outputs.go == 'true'
        run: npm run build
      # Nothing a visitor downloads may contain a secret key (lib/secretGuard.mjs).
      - if: steps.changed.outputs.go == 'true'
        run: npm run check:secrets
